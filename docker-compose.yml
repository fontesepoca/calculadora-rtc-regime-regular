services:
  calculadora:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculadora-rtc-regime-regular:latest
    container_name: calculadora-rtc
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: offline
      JAVA_OPTS: "-XX:MaxRAMPercentage=75"
      # URL consultada pelo comparador de versões (opcional)
      # VERSAO_OFFLINE_URL: https://piloto-cbs.tributos.gov.br/servico/calculadora-consumo/api/calculadora/dados-abertos/versao
    ports:
      - "8080:8080"   # API  -> http://localhost:8080/api
      - "9101:9101"   # Actuator -> http://localhost:9101/health
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9101 && printf \"GET /health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
